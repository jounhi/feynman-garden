name: Deploy to Aliyun Server

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请把这里改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/feynman-garden
            
            # 放弃服务器端的所有本地修改，强行重置为线上最新版
            git fetch --all
            git reset --hard origin/main
            
            npm install
            npm run build
            
            # 移交权限给 Nginx
            chown -R www-data:www-data /var/www/feynman-garden/dist