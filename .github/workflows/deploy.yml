name: Deploy to Aliyun Server

# 触发条件：当 main 分支有 push 操作时执行
on:
  push:
    branches:
      - main  # 如果你的主分支叫 master，请把这里改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免费 Linux 环境作为跳板
    
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}         # 你的服务器 IP (通过变量动态获取)
          username: root                         # 你的服务器登录名
          key: ${{ secrets.SSH_PRIVATE_KEY }}    # 你的服务器私钥 (通过变量动态获取)
          # 下面是登录服务器后要执行的命令
          script: |
            cd /var/www/feynman-garden
            git pull origin main
            npm install
            npm run build