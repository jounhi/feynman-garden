script: |
            cd /var/www/feynman-garden
            
            # 放弃服务器端的所有本地修改，强行将状态重置为与 GitHub 线上绝对一致
            git fetch --all
            git reset --hard origin/main
            
            npm install
            npm run build
            
            # 自动将打包后的文件权限移交给 Nginx 员工
            chown -R www-data:www-data /var/www/feynman-garden/dist